<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museum Sound Book</title>
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #24262b; --soft: #6b6f78; --faint: #a3a6ad; --line: #e4e0d7;
  --accent: #3f6f8a; --accent-soft: rgba(63, 111, 138, 0.14);
  --good: #3c7d4f; --fix: #b07a1c; --cut: #b0413e; --warn: #b07a1c; --bad: #b0413e; --info: #4f6fa8;
  --wave: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17191d; --panel: #1f2227; --ink: #e8e6e1; --soft: #a4a7ae; --faint: #6c7079; --line: #2d3138;
    --accent: #7fb1cc; --accent-soft: rgba(127, 177, 204, 0.16);
    --good: #6dbb83; --fix: #e0ab4c; --cut: #e57a74; --warn: #e0ab4c; --bad: #e57a74; --info: #8fa9dc;
  }
}
:root[data-theme="dark"] {
  --bg: #17191d; --panel: #1f2227; --ink: #e8e6e1; --soft: #a4a7ae; --faint: #6c7079; --line: #2d3138;
  --accent: #7fb1cc; --accent-soft: rgba(127, 177, 204, 0.16);
  --good: #6dbb83; --fix: #e0ab4c; --cut: #e57a74; --warn: #e0ab4c; --bad: #e57a74; --info: #8fa9dc;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
button { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { max-width: 980px; margin: 0 auto; padding: 12px 16px 10px; }
h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: 0.01em; }
.sub { color: var(--soft); font-size: 13px; margin-top: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 13px; cursor: pointer; color: var(--soft); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--soft); cursor: pointer; user-select: none; }
.spacer { flex: 1; }
.progress { height: 3px; background: var(--line); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
main { max-width: 980px; margin: 0 auto; padding: 8px 16px 80px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--soft); margin: 28px 0 8px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
h2 small { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--faint); }
.row { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 8px 0; display: grid; grid-template-columns: 40px 1fr; gap: 4px 12px; scroll-margin: 140px 0 80px; }
.row.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.row.v-good { border-left: 4px solid var(--good); }
.row.v-fix { border-left: 4px solid var(--fix); }
.row.v-cut { border-left: 4px solid var(--cut); }
.row.missing { opacity: 0.72; }
.row > * { min-width: 0; }
.when, .note, .meta, .title, .badge { overflow-wrap: anywhere; }
.play { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); cursor: pointer; display: grid; place-items: center; padding: 0; }
.play:hover { border-color: var(--accent); }
.play svg { width: 14px; height: 14px; fill: var(--ink); }
.play[disabled] { cursor: default; opacity: 0.35; }
.head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.title { font-weight: 600; }
.meta { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.meta code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--soft); }
.when { color: var(--soft); font-size: 14px; }
.note { color: var(--soft); font-size: 13px; font-style: italic; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; }
.badge.clip, .badge.error { color: var(--bad); }
.badge.silent { color: var(--warn); }
.badge.loud, .badge.quiet { color: var(--info); }
.badge.none { color: var(--faint); }
.wave { grid-column: 2; position: relative; height: 56px; border-radius: 6px; background: var(--bg); overflow: hidden; cursor: pointer; margin-top: 4px; }
.wave img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; opacity: 0.9; }
.wave .done { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent-soft); pointer-events: none; }
.wave .head-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); left: 0; display: none; pointer-events: none; }
.row.current .wave .head-line { display: block; }
.wave .time { position: absolute; right: 6px; bottom: 3px; font-size: 11px; color: var(--soft); font-variant-numeric: tabular-nums; pointer-events: none; background: color-mix(in srgb, var(--bg) 80%, transparent); padding: 0 4px; border-radius: 4px; }
.verdict { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; margin-top: 6px; }
.verdict .seg button { padding: 4px 10px; }
.verdict .seg button.good[aria-pressed="true"] { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
.verdict .seg button.fix[aria-pressed="true"] { background: color-mix(in srgb, var(--fix) 22%, transparent); color: var(--fix); }
.verdict .seg button.cut[aria-pressed="true"] { background: color-mix(in srgb, var(--cut) 22%, transparent); color: var(--cut); }
.verdict textarea { flex: 1; min-width: 180px; min-height: 30px; height: 30px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: 13px/1.4 inherit; font-family: inherit; padding: 5px 8px; }
.verdict textarea:focus { outline: none; border-color: var(--accent); height: 64px; }
.verdict textarea.has { height: auto; min-height: 30px; }
.keys { color: var(--faint); font-size: 12px; margin-top: 6px; }
kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); color: var(--soft); }
.empty { color: var(--soft); text-align: center; padding: 40px 0; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); max-width: min(720px, 92vw); width: 100%; }
dialog textarea { width: 100%; height: 50vh; font: 12px ui-monospace, Menlo, monospace; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
.toast.on { opacity: 1; }
@media (max-width: 600px) {
  .row { grid-template-columns: 36px 1fr; padding: 10px 12px; }
  .wave, .verdict { grid-column: 1 / -1; }
  .keys { display: none; }
  .verdict textarea { min-width: 100%; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Museum Sound Book</h1>
    <div class="sub" id="sub"></div>
    <div class="controls">
      <div class="seg" id="filters" role="group" aria-label="Show">
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="unmarked" aria-pressed="false">Unmarked</button>
        <button data-f="fix" aria-pressed="false">Fix</button>
        <button data-f="cut" aria-pressed="false">Cut</button>
        <button data-f="warn" aria-pressed="false">Warnings</button>
      </div>
      <label class="toggle"><input type="checkbox" id="auto"> Auto-advance</label>
      <span class="spacer"></span>
      <button class="btn primary" id="copy">Copy review</button>
    </div>
    <div class="keys"><kbd>space</kbd> play/pause · <kbd>j</kbd>/<kbd>↓</kbd> next · <kbd>k</kbd>/<kbd>↑</kbd> previous · <kbd>1</kbd> good · <kbd>2</kbd> fix · <kbd>3</kbd> cut · <kbd>n</kbd> note · <kbd>a</kbd> auto-advance · <kbd>esc</kbd> leave the note</div>
    <div class="progress"><i id="prog"></i></div>
  </div>
</header>
<main id="list"></main>
<dialog id="dlg"><p style="margin-top:0">The browser would not copy it by itself: select all and copy.</p><textarea id="dlgText" readonly></textarea><p style="text-align:right;margin-bottom:0"><button class="btn" id="dlgClose">Close</button></p></dialog>
<div class="toast" id="toast"></div>
<audio id="audio" preload="none"></audio>
<script>
const SOUNDS = /*SOUNDS*/[];
const GROUPS = /*GROUPS*/[];
const BUILT = /*BUILT*/"";

const KEY = 'museum-soundbook.v1', AUTO = 'museum-soundbook.auto';
let marks = {}; try { marks = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch { marks = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch { /* private window: lasts the visit */ } };
const $ = id => document.getElementById(id), audio = $('audio');
const byId = Object.fromEntries(SOUNDS.map(s => [s.id, s]));
let filter = 'all', current = null, auto = false;
try { auto = localStorage.getItem(AUTO) === '1'; } catch { /* fine */ }
$('auto').checked = auto;

const PLAY = '<svg viewBox="0 0 14 14"><path d="M3 1.5v11l9.5-5.5z"/></svg>', PAUSE = '<svg viewBox="0 0 14 14"><path d="M2.5 1.5h3.2v11H2.5zM8.3 1.5h3.2v11H8.3z"/></svg>';
const fmt = s => !isFinite(s) ? '' : s < 60 ? s.toFixed(1) + ' s' : Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const warned = s => (s.warn && s.warn.length) || !s.recorded;

function rowHtml(s) {
  const m = marks[s.id] || {}, badges = (s.warn || []).map(w => `<span class="badge ${w.kind}" title="${esc(w.text)}">${esc(w.text)}</span>`);
  if (!s.recorded) badges.push(`<span class="badge none">not recorded yet</span>`);
  const meta = s.recorded ? `${fmt(s.dur)} · peak ${s.peak > -100 ? s.peak.toFixed(1) + ' dBFS' : 'none'} · loudest ${s.momentary > -100 ? s.momentary.toFixed(0) + ' LUFS' : 'none'}` : '';
  return `<div class="row${s.recorded ? '' : ' missing'}${m.v ? ' v-' + m.v : ''}" id="r-${esc(s.id)}" data-id="${esc(s.id)}">
    <button class="play" aria-label="Play ${esc(s.title)}" ${s.recorded ? '' : 'disabled'}>${PLAY}</button>
    <div>
      <div class="head"><span class="title">${esc(s.title)}</span><span class="meta">${meta}</span></div>
      <div class="when">${esc(s.when)}</div>
      <div class="meta"><code>${esc(s.src)}</code> · ${esc(s.id)}</div>
      ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
      ${!s.recorded && s.notRecordedWhy && s.notRecordedWhy !== s.note ? `<div class="note">${esc(s.notRecordedWhy)}</div>` : ''}
      ${badges.length ? `<div class="badges">${badges.join('')}</div>` : ''}
    </div>
    ${s.recorded ? `<div class="wave" title="Click to play from here"><img src="${esc(s.wave)}" alt="" loading="lazy"><div class="done"></div><div class="head-line"></div><span class="time">${fmt(s.dur)}</span></div>` : ''}
    <div class="verdict">
      <div class="seg" role="group" aria-label="Verdict">
        <button class="good" data-v="good" aria-pressed="${m.v === 'good'}">Good</button><button class="fix" data-v="fix" aria-pressed="${m.v === 'fix'}">Fix</button><button class="cut" data-v="cut" aria-pressed="${m.v === 'cut'}">Cut</button>
      </div>
      <textarea placeholder="Notes" rows="1" class="${m.n ? 'has' : ''}">${esc(m.n || '')}</textarea>
    </div>
  </div>`;
}

function visible(s) {
  const m = marks[s.id] || {};
  if (filter === 'unmarked') return !m.v;
  if (filter === 'fix') return m.v === 'fix';
  if (filter === 'cut') return m.v === 'cut';
  if (filter === 'warn') return warned(s);
  return true;
}

function render() {
  const out = [];
  const groups = GROUPS.concat([...new Set(SOUNDS.map(s => s.group))].filter(g => !GROUPS.includes(g)));
  for (const g of groups) {
    const all = SOUNDS.filter(s => s.group === g), list = all.filter(visible);
    if (!list.length) continue;
    const rec = all.filter(s => s.recorded).length, marked = all.filter(s => marks[s.id] && marks[s.id].v).length;
    out.push(`<h2>${esc(g)} <small>${rec} recorded${rec < all.length ? `, ${all.length - rec} not yet` : ''} · ${marked} of ${all.length} marked</small></h2>`);
    out.push(list.map(rowHtml).join(''));
  }
  $('list').innerHTML = out.join('') || '<div class="empty">Nothing here.</div>';
  if (current && $('r-' + current)) $('r-' + current).classList.add('current');
  summary();
  if (current) progressTo(current);
}

function summary() {
  const n = SOUNDS.length, rec = SOUNDS.filter(s => s.recorded).length, c = { good: 0, fix: 0, cut: 0 };
  for (const s of SOUNDS) { const v = marks[s.id] && marks[s.id].v; if (v) c[v]++; }
  const done = c.good + c.fix + c.cut, w = SOUNDS.filter(s => s.warn && s.warn.length).length;
  $('sub').textContent = `${rec} of ${n} sounds recorded${BUILT ? ' · ' + BUILT : ''} · ${done} marked: ${c.good} good, ${c.fix} fix, ${c.cut} cut · ${w} with warnings`;
  $('prog').style.width = (100 * done / n).toFixed(1) + '%';
}

function rows() { return [...document.querySelectorAll('.row')]; }
function select(id, { scroll = true } = {}) {
  if (current && $('r-' + current)) $('r-' + current).classList.remove('current');
  current = id; const r = $('r-' + id);
  if (r) { r.classList.add('current'); if (scroll) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
function play(id, at = 0) {
  const s = byId[id]; if (!s) return;
  if (current !== id) { select(id); }
  if (!s.recorded) { audio.pause(); return; }
  if (audio.dataset.id !== id) { const old = audio.dataset.id; audio.src = s.mp3; audio.dataset.id = id; if (old) progressTo(old); }
  const go = () => { try { if (at) audio.currentTime = at; } catch { /* not seekable yet */ } audio.play().catch(() => {}); };
  if (audio.readyState >= 1 || !at) go(); else audio.addEventListener('loadedmetadata', go, { once: true });
}
function toggle() {
  if (!current) { const r = rows()[0]; if (r) play(r.dataset.id); return; }
  if (audio.dataset.id === current && !audio.paused) audio.pause(); else if (audio.dataset.id === current && audio.src) audio.play().catch(() => {}); else play(current);
}
function step(d, andPlay = !audio.paused) {
  const rs = rows(); if (!rs.length) return;
  let i = rs.findIndex(r => r.dataset.id === current);
  i = i < 0 ? (d > 0 ? 0 : rs.length - 1) : Math.max(0, Math.min(rs.length - 1, i + d));
  const id = rs[i].dataset.id;
  if (andPlay && byId[id].recorded) play(id); else { audio.pause(); select(id); }
}
function mark(id, v) {
  const m = marks[id] || (marks[id] = {});
  m.v = m.v === v ? undefined : v; if (!m.v && !m.n) delete marks[id]; save();
  const r = $('r-' + id);
  if (r) { r.classList.remove('v-good', 'v-fix', 'v-cut'); if (m.v) r.classList.add('v-' + m.v); r.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === m.v)); }
  summary();
  if (filter !== 'all' && r && !visible(byId[id])) { /* kept on screen until the filter is changed, so it does not jump away */ }
}
function progressTo(id) {
  const r = $('r-' + id); if (!r) return;
  const w = r.querySelector('.wave'); if (!w) return;
  const d = audio.dataset.id === id && audio.duration ? audio.duration : 0, f = d ? Math.min(1, audio.currentTime / d) : 0;
  w.querySelector('.done').style.width = (f * 100) + '%'; w.querySelector('.head-line').style.left = `calc(${(f * 100).toFixed(2)}% - 1px)`;
  w.querySelector('.time').textContent = d ? `${fmt(audio.currentTime)} / ${fmt(d)}` : fmt(byId[id].dur);
}
function paintButtons() {
  document.querySelectorAll('.row .play').forEach(b => { const id = b.closest('.row').dataset.id; b.innerHTML = id === audio.dataset.id && !audio.paused ? PAUSE : PLAY; });
}

audio.addEventListener('timeupdate', () => { if (audio.dataset.id) progressTo(audio.dataset.id); });
audio.addEventListener('play', paintButtons); audio.addEventListener('pause', paintButtons);
audio.addEventListener('ended', () => { paintButtons(); if (auto) { const rs = rows(), i = rs.findIndex(r => r.dataset.id === current); for (let j = i + 1; j < rs.length; j++) if (byId[rs[j].dataset.id].recorded) { play(rs[j].dataset.id); return; } } });
(function tick() { if (!audio.paused && audio.dataset.id) progressTo(audio.dataset.id); requestAnimationFrame(tick); })();

$('list').addEventListener('click', e => {
  const r = e.target.closest('.row'); if (!r) return; const id = r.dataset.id;
  if (e.target.closest('.play')) { if (audio.dataset.id === id && !audio.paused) audio.pause(); else if (audio.dataset.id === id) audio.play().catch(() => {}); else play(id); return; }
  const v = e.target.closest('[data-v]'); if (v) { select(id, { scroll: false }); mark(id, v.dataset.v); return; }
  const w = e.target.closest('.wave');
  if (w) { const s = byId[id], b = w.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)), d = (audio.dataset.id === id && audio.duration) || s.dur || 0; play(id, f * d); return; }
  if (!e.target.closest('textarea')) select(id, { scroll: false });
});
$('list').addEventListener('input', e => {
  if (!e.target.matches('textarea')) return; const id = e.target.closest('.row').dataset.id, m = marks[id] || (marks[id] = {});
  m.n = e.target.value; if (!m.n && !m.v) delete marks[id]; e.target.classList.toggle('has', !!m.n); save();
});
$('list').addEventListener('focusin', e => { if (e.target.matches('textarea')) select(e.target.closest('.row').dataset.id, { scroll: false }); });
$('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f;
  $('filters').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
});
$('auto').addEventListener('change', e => { auto = e.target.checked; try { localStorage.setItem(AUTO, auto ? '1' : '0'); } catch { /* fine */ } });

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('textarea, input[type="text"]')) { if (e.key === 'Escape') t.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch (e.key) {
    case ' ': e.preventDefault(); toggle(); break;
    case 'j': case 'ArrowDown': e.preventDefault(); step(1); break;
    case 'k': case 'ArrowUp': e.preventDefault(); step(-1); break;
    case 'ArrowRight': if (!audio.paused) { e.preventDefault(); audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 2); } break;
    case 'ArrowLeft': if (!audio.paused) { e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 2); } break;
    case '1': if (current) mark(current, 'good'); break;
    case '2': if (current) mark(current, 'fix'); break;
    case '3': if (current) mark(current, 'cut'); break;
    case 'n': if (current) { const a = $('r-' + current) && $('r-' + current).querySelector('textarea'); if (a) { e.preventDefault(); a.focus(); } } break;
    case 'a': auto = !auto; $('auto').checked = auto; try { localStorage.setItem(AUTO, auto ? '1' : '0'); } catch { /* fine */ } flash(auto ? 'Auto-advance on' : 'Auto-advance off'); break;
  }
});

function reviewText() {
  const out = [], c = { good: 0, fix: 0, cut: 0 };
  for (const s of SOUNDS) { const v = marks[s.id] && marks[s.id].v; if (v) c[v]++; }
  out.push(`Museum sound review: ${c.fix} to fix, ${c.cut} to cut, ${c.good} good, of ${SOUNDS.length} sounds.`);
  for (const v of ['fix', 'cut']) {
    const list = SOUNDS.filter(s => marks[s.id] && marks[s.id].v === v);
    if (!list.length) continue;
    out.push('', v === 'fix' ? 'FIX' : 'CUT', '');
    for (const s of list) {
      out.push(`- ${s.title} [${s.id}] (${s.group})`, `  source: ${s.src}`, `  when: ${s.when}`);
      if (marks[s.id].n) out.push(`  notes: ${marks[s.id].n.replace(/\n+/g, ' / ')}`);
    }
  }
  const noted = SOUNDS.filter(s => marks[s.id] && marks[s.id].n && !['fix', 'cut'].includes(marks[s.id].v));
  if (noted.length) { out.push('', 'OTHER NOTES', ''); for (const s of noted) out.push(`- ${s.title} [${s.id}] (${s.src}): ${marks[s.id].n.replace(/\n+/g, ' / ')}`); }
  return out.join('\n');
}
function flash(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(flash.t); flash.t = setTimeout(() => el.classList.remove('on'), 1600); }
$('copy').addEventListener('click', async () => {
  const text = reviewText();
  try { await navigator.clipboard.writeText(text); flash('Review copied'); return; } catch { /* file:// may refuse */ }
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch { ok = false; } ta.remove();
  if (ok) { flash('Review copied'); return; }
  $('dlgText').value = text; $('dlg').showModal(); $('dlgText').select();
});
$('dlgClose').addEventListener('click', () => $('dlg').close());

render();
</script>
</body>
</html>
