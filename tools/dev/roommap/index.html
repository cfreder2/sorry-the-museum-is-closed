<title>Museum Room Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a floor plan you operate. A bar of levels and layers on top, the plan filling the left, a reading panel on the right
   (below the plan on a phone). Colour says two things only: what state a room is in, and what family a marker belongs to. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --ink: #172230; --muted: #5a6677; --line: #c6ced9; --line-soft: #dfe4eb;
  --accent: #0a7a55; --accent-ink: #ffffff; --warn: #b45309;
  --room-do: #c9e8d8; --room-find: #d8e3f6; --room-living: #dccbf3; --room-pics: #ece6f4; --room-none: #f4f6f9; --room-shut: #cfd4db; --room-secret: #f1e2b8;
  --hatch: #9aa3b0; --wall: #46546a; --door: #ffffff; --label: #2a3647;
  --m-story: #0d9a57; --m-do: #d97706; --m-sec: #d92626; --m-paint: #7c3aed; --m-find: #2563eb; --m-way: #0e7490; --m-ring: #ffffff;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif; --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d131c; --surface: #151d29; --ink: #e6ebf2; --muted: #93a0b3; --line: #2c3a4d; --line-soft: #202b3a;
  --accent: #4fdc95; --accent-ink: #062214; --warn: #fbbf24;
  --room-do: #1d4a39; --room-find: #22375a; --room-living: #47356e; --room-pics: #2c2640; --room-none: #19222f; --room-shut: #0f151e; --room-secret: #4b3d18;
  --hatch: #3a4658; --wall: #8a99ae; --door: #0d131c; --label: #d5dce6;
  --m-story: #4ade80; --m-do: #fbbf24; --m-sec: #f87171; --m-paint: #b197fc; --m-find: #6ba8ff; --m-way: #38d0e6; --m-ring: #0d131c;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d131c; --surface: #151d29; --ink: #e6ebf2; --muted: #93a0b3; --line: #2c3a4d; --line-soft: #202b3a;
  --accent: #4fdc95; --accent-ink: #062214; --warn: #fbbf24;
  --room-do: #1d4a39; --room-find: #22375a; --room-living: #47356e; --room-pics: #2c2640; --room-none: #19222f; --room-shut: #0f151e; --room-secret: #4b3d18;
  --hatch: #3a4658; --wall: #8a99ae; --door: #0d131c; --label: #d5dce6;
  --m-story: #4ade80; --m-do: #fbbf24; --m-sec: #f87171; --m-paint: #b197fc; --m-find: #6ba8ff; --m-way: #38d0e6; --m-ring: #0d131c;
  color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; box-sizing: border-box; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 12px; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.brand { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; margin: 0; }
.build { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.seg { display: inline-flex; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 11px; border-right: 1px solid var(--line); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg small { font-family: var(--mono); font-size: 10.5px; opacity: 0.7; margin-left: 4px; }
.search { flex: 1 1 180px; min-width: 0; max-width: 320px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 12.5px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip small { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 12px; }
.stage { position: relative; min-height: 0; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.drag { cursor: grabbing; }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: calc(100% - 20px); padding: 6px 9px; border-radius: 8px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line-soft); font-size: 11.5px; color: var(--muted); pointer-events: none; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend b { width: 12px; height: 12px; border: 1px solid var(--wall); background: var(--c); display: inline-block; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1; }
.tip { position: absolute; pointer-events: none; padding: 3px 8px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 12px; white-space: nowrap; transform: translate(12px, 12px); }
.panel { min-height: 0; min-width: 0; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1.2; margin: 0; text-wrap: balance; }
.panel h3 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }
.sub { color: var(--muted); margin-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.id { font-family: var(--mono); }
.pill.open { border-color: var(--accent); color: var(--accent); }
.pill.shut { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill.empty { border-color: var(--warn); color: var(--warn); }
.need { border-left: 3px solid var(--warn); padding: 2px 0 2px 10px; }
.group { display: flex; flex-direction: column; gap: 6px; }
.item { border: 1px solid var(--line-soft); border-radius: 8px; }
.item > summary, .rowbtn { list-style: none; display: flex; align-items: baseline; gap: 8px; padding: 7px 10px; cursor: pointer; width: 100%; box-sizing: border-box; text-align: left; background: none; border: 0; }
.item > summary::-webkit-details-marker { display: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; transform: translateY(1px); }
.item .nm { font-weight: 500; flex: 1 1 auto; min-width: 0; }
.item .kd { font-size: 11px; color: var(--muted); white-space: nowrap; }
.item .body { padding: 0 10px 10px 27px; display: flex; flex-direction: column; gap: 6px; }
.words { margin: 0; padding: 7px 10px; border-radius: 6px; background: var(--bg); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.note { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
.note select, .note textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 6px 8px; }
.note textarea { min-height: 70px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.hint { color: var(--muted); font-size: 12.5px; }
.list { display: flex; flex-direction: column; }
.list .rowbtn { border-bottom: 1px solid var(--line-soft); padding: 7px 2px; }
.list .rowbtn .nm { flex: 1 1 auto; min-width: 0; }
.list .rowbtn .ct { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.sw { width: 11px; height: 11px; border: 1px solid var(--wall); background: var(--c); flex: none; transform: translateY(1px); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line-soft); border-radius: 8px; padding: 7px 9px; }
.stat b { display: block; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--muted); }
@media (max-width: 760px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 58vh; min-height: 300px; }
  .panel { overflow: visible; }
}
</style>

<div class="app">
  <div class="bar">
    <h1 class="brand">Museum Room Map</h1><span class="build" id="build"></span>
    <div class="seg" id="levels" role="group" aria-label="Level"></div>
    <div class="seg" id="views" role="group" aria-label="Panel">
      <button id="vSel" aria-pressed="true">Selected</button><button id="vRooms" aria-pressed="false">Rooms</button><button id="vNotes" aria-pressed="false">My notes<small id="noteCount"></small></button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search rooms, items, words" aria-label="Search rooms, items and words">
  </div>
  <div class="bar">
    <div class="chips" id="chips" aria-label="Marker layers"></div>
    <div class="chips"><button class="chip" id="tPaths" aria-pressed="true"><i style="--c:var(--muted)"></i>Runs and beats</button><button class="chip" id="tShut" aria-pressed="true"><i style="--c:var(--room-shut)"></i>Shut rooms</button></div>
  </div>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Floor plan. Use the Rooms list for a keyboard route to every room."></canvas>
      <div class="zoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button id="zFit" aria-label="Fit the level" title="Fit the level">⤢</button></div>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"><p class="hint">Loading the building…</p></aside>
  </div>
</div>

  { id: 'way', name: 'Ways in', c: '--m-way', kinds: ['way-in'] },
];
const KIND_NAME = { 'whiteboard': 'Whiteboard', 'guard-note': 'Guard’s note', 'mouse': 'Mouse', 'nest': 'Mouse nest', 'desk': 'Desk', 'story-page': 'Story page', 'painting-secret': 'Secret painting', 'scene': 'Scene', 'painting-puzzle': 'Puzzle', 'piano': 'Piano', 'arcade': 'Arcade machine', 'film-screen': 'Film screen', 'vending': 'Vending machine', 'lion': 'Lion', 'race': 'Race', 'button': 'Button', 'coat-check': 'Coat check', 'gift-shop': 'Gift shop', 'easel': 'Easel', 'other': 'Other', 'painting-living': 'Living painting', 'painting-escape': 'Escaping painting', 'monitor': 'Monitor', 'security-desk': 'Security desk', 'terminal': 'Terminal', 'heist-console': 'Heist console', 'robot': 'Robot', 'lost-property': 'Lost property', 'hoop': 'Hoop', 'cones': 'Cones', 'stunt-kit': 'Stunt kit', 'perch': 'Perch', 'mosaic-tile': 'Mosaic tile', 'trophy-room': 'Trophy room', 'bench': 'Bench', 'secret': 'Secret', 'way-in': 'Way in' };

const gOf = k => groupOf[k] || GROUPS[1];
const FIND_ONLY = new Set(['find', 'way']);
const CLASSES = [
  { id: 'do', name: 'Something to do', c: '--room-do' }, { id: 'find', name: 'A find only', c: '--room-find' }, { id: 'living', name: 'Living paintings', c: '--room-living' },
  { id: 'pics', name: 'Pictures only', c: '--room-pics' }, { id: 'none', name: 'Nothing', c: '--room-none' }, { id: 'secret', name: 'Secret', c: '--room-secret' }, { id: 'shut', name: 'Shut', c: '--room-shut' },

const CLASS = Object.fromEntries(CLASSES.map(c => [c.id, c]));
const STATUS = [['', 'No decision'], ['keep', 'Keep as it is'], ['needs', 'Needs something to do'], ['change', 'Change this'], ['remove', 'Remove this'], ['shut', 'Shut this room'], ['open', 'Open this room']];

const safeId = s => String(s).replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 120);

const S = { data: null, level: '1', sel: null, view: 'sel', q: '', off: new Set(), paths: true, shut: true, notes: {}, db: null, shared: false, hi: null, roomFilter: 'all' };

// ---------------------------------------------------------------- data
function prepare(d) {

  for (const r of d.rooms) {

const roomsHere = () => D.rooms.filter(r => r.level === S.level && (S.shut || !r.shut));
const itemsHere = () => D.items.filter(i => i.level === S.level && !S.off.has(gOf(i.kind).id) && (S.shut || !(i.room && roomById[i.room] && roomById[i.room].shut)));
function fit(rooms) {

  const x0 = Math.min(...rooms.map(r => r.x0)), x1 = Math.max(...rooms.map(r => r.x1)), z0 = Math.min(...rooms.map(r => r.z0)), z1 = Math.max(...rooms.map(r => r.z1)), pad = 28;
